name: Update map data

# Downloads a sailing area's coastline from OpenStreetMap and its land heights (Copernicus
# GLO-30) and commits the game's map files. Areas are listed in scripts/map-areas.mjs.
# Run it by hand (Actions -> Update map data -> Run workflow) when an area is added or changes.
on:
  workflow_dispatch:
    inputs:
      area:
        description: 'Area (tejo, medio, arcachon, aveiro, pasaia, azores, madeira, oeste), or several separated by spaces'
        required: true
        default: 'tejo'
      lighthouses_only:
        description: 'Only add the lighthouses (keep the coastline and heights as they are)'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  map:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-save geotiff@3.0.5
      - name: Build the maps
        env:
          AREAS: ${{ inputs.area }}
          ONLY_LIGHTHOUSES: ${{ inputs.lighthouses_only }}
        run: |
          for a in $AREAS; do
            if [ "$ONLY_LIGHTHOUSES" != "true" ]; then
              node scripts/fetch-map.mjs --area "$a"
              node scripts/fetch-heights.mjs --area "$a"
            fi
            node scripts/fetch-lighthouses.mjs --area "$a"
          done
      - name: Commit the maps
        env:
          AREAS: ${{ inputs.area }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/assets/map
          if git diff --cached --quiet; then echo "Maps unchanged"; else
            git commit -m "Update maps ($AREAS) from OpenStreetMap and Copernicus heights"
            git pull --rebase
            git push
          fi
