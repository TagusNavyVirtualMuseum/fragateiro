name: Test

# Development: every push and pull request is tested and built. Nothing is published; the
# built game is kept for 14 days as a download ("game" under the run's Artifacts), to try it
# before publishing. Publishing is a separate, manual step: publish.yml.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - run: npm run build
      - uses: actions/upload-artifact@v4
        if: github.event_name != 'pull_request'
        with:
          name: game
          path: dist
          retention-days: 14
