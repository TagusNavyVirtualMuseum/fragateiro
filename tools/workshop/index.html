<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Boat workshop — Fragateiro</title>
    <style>
      :root { --bg: #20140a; --panel: #2e1e10; --line: #7a5a30; --ink: #f2e6cc; --muted: #c4ad84; --accent: #e2b866; font-family: 'EB Garamond', Georgia, serif; font-size: 15px; color: var(--ink); background: var(--bg); }
      body { margin: 0; height: 100vh; display: grid; grid-template-columns: 1fr 380px; overflow: hidden; }
      #view { position: relative; }
      #view canvas { width: 100%; height: 100%; display: block; outline: none; }
      #prompt { position: absolute; top: 12px; left: 50%; transform: translateX(-50%); background: #f3e6c8; color: #2b1a0c; border: 1px solid var(--line); border-radius: 8px; padding: 8px 14px; font-size: 18px; display: none; }
      #prompt small { display: block; font-size: 13px; color: #6b5030; }
      #tabs { position: absolute; top: 12px; left: 12px; display: flex; gap: 6px; }
      #help { position: absolute; bottom: 10px; left: 12px; color: #fff; font-size: 13px; text-shadow: 0 1px 2px #000; }
      aside { background: var(--panel); border-left: 1px solid var(--line); overflow-y: auto; padding: 12px 14px 40px; }
      h1 { font-family: 'IM Fell English', Georgia, serif; font-weight: 400; font-size: 24px; margin: 0 0 4px; }
      h2 { font-family: 'IM Fell English', Georgia, serif; font-weight: 400; font-size: 18px; margin: 18px 0 6px; color: var(--accent); border-top: 1px solid var(--line); padding-top: 10px; }
      p.note { color: var(--muted); font-size: 13px; margin: 4px 0; line-height: 1.35; }
      label { display: flex; align-items: center; gap: 8px; margin: 4px 0; }
      label > span:first-child { width: 120px; color: var(--muted); font-size: 14px; }
      input[type=text], input[type=number], select, textarea { flex: 1; font: inherit; background: #1a1008; color: var(--ink); border: 1px solid var(--line); border-radius: 5px; padding: 3px 6px; min-width: 0; }
      textarea { min-height: 54px; }
      button { font: inherit; background: linear-gradient(#c9a25c, #a07a3a); color: #2a180b; border: 1px solid #6b4c22; border-radius: 6px; padding: 3px 10px; cursor: pointer; }
      button.secondary { background: transparent; color: var(--accent); border-color: var(--line); }
      button.active { outline: 2px solid #fff; }
      button.big { font-size: 18px; padding: 6px 18px; }
      .row { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin: 4px 0; }
      .item { border: 1px solid var(--line); border-radius: 6px; padding: 6px 8px; margin: 6px 0; }
      .item .head { display: flex; gap: 6px; align-items: center; }
      .item .head strong { flex: 1; }
      .ok { color: #9fd49f; }
      .todo { color: #f0b070; }
      table { border-collapse: collapse; font-size: 13px; margin-top: 6px; }
      td, th { padding: 1px 8px; text-align: right; border-bottom: 1px solid #4a3418; }
      pre { white-space: pre-wrap; font-size: 11px; background: #1a1008; padding: 6px; border-radius: 6px; max-height: 160px; overflow: auto; }
      .swatch { display: inline-block; width: 12px; height: 12px; border-radius: 2px; margin-right: 4px; vertical-align: middle; }
      #status { min-height: 1.2em; }
    </style>
  </head>
  <body>
    <div id="view">
      <canvas id="canvas"></canvas>
      <div id="tabs"></div>
      <div id="prompt"></div>
      <div id="help">Side view: wheel to zoom, drag with the right button to move. Esc cancels a click step; Enter finishes a list of points.</div>
    </div>
    <aside id="panel"></aside>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
