<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Fragateiro — Tagus sailing games</title>
    <meta name="description" content="Browser mini-games with the traditional sailing boats of the Tagus River." />
    <style>
      :root { font-family: 'EB Garamond', Georgia, serif; font-size: 17px; color: #f5e9cf; background: radial-gradient(circle at 50% 0, #5d3a1f, #2a180b 70%); }
      h1, h2 { font-family: 'IM Fell English', Georgia, serif; font-weight: 400; }
      .card { background: rgba(0, 0, 0, 0.18) !important; border-color: rgba(201, 162, 92, 0.6) !important; }
      body { margin: 0; min-height: 100vh; display: flex; justify-content: center; }
      main { max-width: 860px; padding: 48px 16px; }
      h1 { font-size: 34px; margin: 0 0 8px; }
      p { color: #d4bf96; line-height: 1.55; }
      .games { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 16px; margin-top: 28px; }
      .card { display: block; padding: 18px; border-radius: 12px; border: 1px solid rgba(255,255,255,.15); background: rgba(255,255,255,.05); color: inherit; text-decoration: none; }
      a.card:hover { border-color: #e2b866 !important; }
      .card h2 { margin: 0 0 6px; font-size: 18px; }
      .card p { margin: 0; font-size: 14px; }
      .soon { opacity: .55; }
      .boats { display: grid; grid-template-columns: repeat(auto-fit, minmax(380px, 1fr)); gap: 20px; margin-top: 18px; }
      .boat { border: 1px solid rgba(201, 162, 92, 0.6); border-radius: 12px; overflow: hidden; background: rgba(0, 0, 0, 0.18); }
      .boat img { width: 100%; aspect-ratio: 3 / 2; object-fit: cover; display: block; border-bottom: 2px solid rgba(201, 162, 92, 0.6); }
      .boat div { padding: 14px 18px 16px; }
      .boat h3 { font-family: 'IM Fell English', Georgia, serif; font-weight: 400; font-size: 22px; margin: 0 0 6px; }
      .boat p { margin: 0; font-size: 15px; }
      .boat.dev img { filter: grayscale(0.6) brightness(0.8); }
      .boat .badge { display: inline-block; margin-left: 8px; padding: 1px 8px; border: 1px solid #e2b866; border-radius: 10px; color: #e2b866; font-family: 'EB Garamond', Georgia, serif; font-size: 13px; vertical-align: middle; }
      .boat .facts { margin-top: 8px; color: #e2b866; font-size: 14px; }
      h2.section { margin: 40px 0 0; font-size: 26px; }
      .note { font-size: 13px; margin-top: 10px; }
      @media (max-width: 440px) { .boats { grid-template-columns: 1fr; } }
      .links { display: flex; flex-wrap: wrap; gap: 10px 20px; margin-top: 36px; font-size: 15px; }
      .links a { color: #e2b866; text-decoration: none; }
      .links a:hover { text-decoration: underline; }
      .partners { margin-top: 32px; padding: 18px 20px; border-radius: 12px; background: #fff; display: flex; flex-wrap: wrap; align-items: center; justify-content: space-around; gap: 20px 28px; }
      .partners a { display: block; }
      h2.section.small { font-size: 20px; margin-top: 32px; }
      h2.section.small + .partners { margin-top: 12px; }
      .partners.ack { justify-content: flex-start; }
      .partners.ack p { margin: 0; color: #3b3b3b; font-size: 15px; flex: 1; min-width: 220px; }
      .boat .credits { margin-top: 8px; font-size: 13px; color: #a9b8bf; line-height: 1.45; }
      .partners img { height: 56px; width: auto; display: block; }
      footer { margin-top: 28px; font-size: 13px; color: #7d9099; line-height: 1.5; }
      footer a { color: #a9b8bf; }
      .top { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
      .lang-switch { display: flex; gap: 6px; }
      .lang-switch button { font: inherit; font-size: 14px; padding: 3px 10px; border-radius: 6px; border: 1px solid rgba(201, 162, 92, 0.6); background: transparent; color: #e2b866; cursor: pointer; }
      .lang-switch button.active { background: #e2b866; color: #2a180b; }
    </style>
    <script type="module">
      import '@fontsource/eb-garamond/latin-400.css';
      import '@fontsource/im-fell-english/latin-400.css';
      import { languageSwitch, t, translatePage } from './src/i18n';
      translatePage();
      document.title = t('land.pageTitle');
      document.getElementById('lang').replaceWith(languageSwitch());
    </script>
  </head>
  <body>
    <main>
      <div class="top"><h1>Fragateiro</h1><span id="lang"></span></div>
      <p data-i18n="land.intro"></p>
      <div class="games">
        <a class="card" href="./games/sailing/">
          <h2 data-i18n="land.game.title"></h2>
          <p data-i18n="land.game.desc"></p>
        </a>
        <div class="card soon">
          <h2 data-i18n="land.learn.title"></h2>
          <p data-i18n="land.learn.desc"></p>
        </div>
        <a class="card" href="./games/sailing/">
          <h2 data-i18n="land.fish.title"></h2>
          <p data-i18n="land.fish.desc"></p>
        </a>
      </div>
      <h2 class="section" data-i18n="land.boats"></h2>
      <div class="boats">
        <article class="boat">
          <img src="./src/assets/boats/falua.jpg" alt="" data-i18n-alt="boat.falua.alt" />
          <div>
            <h3>Falua</h3>
            <p data-i18n="boat.falua.desc"></p>
            <p class="facts" data-i18n="boat.falua.facts"></p>
            <p class="credits">v0.2 · <span data-i18n="credit.gamification"></span>: Rama Modeliar<br />v0.1 · <span data-i18n="credit.model"></span>: Laura Baeta</p>
          </div>
        </article>
        <article class="boat">
          <img src="./src/assets/boats/muleta.jpg" alt="" data-i18n-alt="boat.muleta.alt" />
          <div>
            <h3>Muleta</h3>
            <p data-i18n="boat.muleta.desc"></p>
            <p class="facts" data-i18n="boat.muleta.facts"></p>
            <p class="credits">v0.2 · <span data-i18n="credit.trawling"></span>: Nuno Covão, João Costa<br />v0.1 · <span data-i18n="credit.model"></span>: Mafalda Perdigão, Pedro Ulisses</p>
          </div>
        </article>
        <article class="boat">
          <img src="./src/assets/boats/fragata.jpg" alt="" data-i18n-alt="boat.fragata.alt" />
          <div>
            <h3>Fragata</h3>
            <p data-i18n="boat.fragata.desc"></p>
            <p class="facts" data-i18n="boat.fragata.facts"></p>
            <p class="credits">v0.2: Pedro Oliveira, Daniela Santos<br />v0.1 · <span data-i18n="credit.model"></span>: Duarte Gonçalves, Rodrigo Pereira</p>
          </div>
        </article>
      </div>

      <h2 class="section" data-i18n="land.devBoats"></h2>
      <p class="note" data-i18n="land.devNote"></p>
      <div class="boats">
        <article class="boat dev">
          <img src="./src/assets/boats/catraio.jpg" alt="" data-i18n-alt="boat.catraio.alt" />
          <div>
            <h3>Catraio <span class="badge" data-i18n="land.dev"></span></h3>
            <p data-i18n="boat.catraio.desc"></p>
            <p class="facts" data-i18n="boat.catraio.facts"></p>
            <p class="credits" data-i18n="credit.miraro"></p>
          </div>
        </article>
        <article class="boat dev">
          <img src="./src/assets/boats/canoa.jpg" alt="" data-i18n-alt="boat.canoa.alt" />
          <div>
            <h3>Canoa <span class="badge" data-i18n="land.dev"></span></h3>
            <p data-i18n="boat.canoa.desc"></p>
            <p class="facts" data-i18n="boat.canoa.facts"></p>
            <p class="credits" data-i18n="credit.ai"></p>
          </div>
        </article>
        <article class="boat dev">
          <img src="./src/assets/boats/pinasse.jpg" alt="" data-i18n-alt="boat.pinasse.alt" />
          <div>
            <h3>Pinasse à voile <span class="badge" data-i18n="land.dev"></span></h3>
            <p data-i18n="boat.pinasse.desc"></p>
            <p class="facts" data-i18n="boat.pinasse.facts"></p>
            <p class="credits" data-i18n="credit.ai"></p>
          </div>
        </article>
        <article class="boat dev">
          <img src="./src/assets/boats/moliceiro.jpg" alt="" data-i18n-alt="boat.moliceiro.alt" />
          <div>
            <h3>Moliceiro <span class="badge" data-i18n="land.dev"></span></h3>
            <p data-i18n="boat.moliceiro.desc"></p>
            <p class="facts" data-i18n="boat.moliceiro.facts"></p>
            <p class="credits" data-i18n="credit.ai"></p>
          </div>
        </article>
        <article class="boat dev">
          <img src="./src/assets/boats/rabelo.jpg" alt="" data-i18n-alt="boat.rabelo.alt" />
          <div>
            <h3>Barco rabelo <span class="badge" data-i18n="land.dev"></span></h3>
            <p data-i18n="boat.rabelo.desc"></p>
            <p class="facts" data-i18n="boat.rabelo.facts"></p>
            <p class="credits" data-i18n="credit.ai"></p>
          </div>
        </article>
      </div>

      <p class="note" data-i18n="land.note"></p>

      <nav class="links">
        <a href="https://tagusnavyvirtualmuseum.github.io/about.html" data-i18n="land.about"></a>
        <a href="https://doi.org/10.1016/j.daach.2025.e00475" data-i18n="land.paper"></a>
        <a href="https://tagusnavyvirtualmuseum.github.io/" data-i18n="land.museum"></a>
      </nav>
      <h2 class="section small" data-i18n="land.partners"></h2>
      <div class="partners">
        <a href="https://tecnico.ulisboa.pt/" title="Instituto Superior Técnico"><img src="./src/assets/logos/ist.png" alt="Instituto Superior Técnico" /></a>
        <a href="https://www.inesc-id.pt/" title="INESC-ID"><img src="./src/assets/logos/inesc-id.png" alt="INESC-ID Lisboa" /></a>
        <a href="https://www.isel.pt/" title="Instituto Superior de Engenharia de Lisboa"><img src="./src/assets/logos/isel.png" alt="ISEL" /></a>
      </div>
      <h2 class="section small" data-i18n="land.ack"></h2>
      <div class="partners ack">
        <a href="https://ccm.marinha.pt/pt/museu" title="Museu de Marinha"><img src="./src/assets/logos/museu-marinha.png" alt="Museu de Marinha" style="height: 76px" /></a>
        <p data-i18n="land.ackText"></p>
      </div>
      <footer data-i18n="land.footer"></footer>
    </main>
  </body>
</html>
